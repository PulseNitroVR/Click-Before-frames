name: Build Platform Mods
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: iOS
            os: macos-latest
            target: iOS
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Extract source archive
        run: python -c "import zipfile; zipfile.ZipFile('click-before-frames-source-upload-20261103.zip').extractall('.')"
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-geode
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
