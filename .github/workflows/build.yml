name: Build Platform Mods
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: iOS
            os: macos-latest
            target: iOS
            configure-args: '-DCMAKE_PROJECT_GeodeBindings_INCLUDE="$GITHUB_WORKSPACE/ios-fmod-fix.cmake"'
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Extract source archive
        run: python -c "import zipfile; zipfile.ZipFile('click-before-frames-source-upload-20261103.zip').extractall('.')"
      - name: Set a fork-specific mod ID
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("mod.json")
          data = manifest.read_text(encoding="utf-8")
          old_id = '"id": "pulse.input-buffer"'
          if data.count(old_id) != 1:
              raise SystemExit("Expected the original mod ID exactly once")
          manifest.write_text(data.replace(old_id, '"id": "pulse.input-buffer-custom"'), encoding="utf-8")
          PY
      - name: Add FMOD declarations for iOS bindings
        if: matrix.name == 'iOS'
        shell: bash
        run: |
          cat > ios-fmod-fix.cmake <<'EOF'
          cmake_language(DEFER CALL target_compile_options GeodeBindings PRIVATE "-include" "Geode/fmod/fmod.h")
          EOF
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          configure-args: ${{ matrix.configure-args }}
      - name: Collect package
        shell: bash
        run: |
          mkdir -p output
          find build -type f -name '*.geode' -exec cp '{}' output/ \;
          test -n "$(find output -type f -name '*.geode' -print -quit)"
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-geode
          path: output/*.geode
          if-no-files-found: error
          retention-days: 14
